name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify release versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $expected = $env:RELEASE_TAG.TrimStart('v')
          foreach ($path in @(
            "crates/app-core/Cargo.toml",
            "crates/gpuix-app/Cargo.toml",
            "crates/cli/Cargo.toml",
            "crates/config/Cargo.toml"
          )) {
            $match = Select-String -Path $path -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
            if ($match.Matches[0].Groups[1].Value -ne $expected) {
              throw "Version mismatch: tag=$expected; $path=$($match.Matches[0].Groups[1].Value)"
            }
          }
          $frontendVersion = (Get-Content "apps/gpuix/package.json" -Raw | ConvertFrom-Json).version
          if ($frontendVersion -ne $expected) {
            throw "Frontend version mismatch: tag=$expected; frontend=$frontendVersion"
          }

      - name: Test Rust workspace
        shell: pwsh
        run: |
          cargo test --workspace --target x86_64-pc-windows-msvc
          cargo clippy --workspace --target x86_64-pc-windows-msvc -- -D warnings

      - name: Build gpuix application and NSIS installer
        shell: cmd
        run: build.cmd publish

      - name: Build updater packager
        shell: pwsh
        run: cargo build --release -p ssh-router-update-packager

      - name: Create signed updater metadata
        shell: pwsh
        env:
          # 保留既有仓库 Secret 名称，避免升级构建链时要求人工迁移外部密钥。
          SSH_ROUTER_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SSH_ROUTER_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $installerName = "SSH-Router_${version}_x64-setup.exe"
          @"
          ## SSH Router $env:RELEASE_TAG

          Windows OpenSSH 多端口智能路由器，使用 gpuix 原生界面与 Rust 业务核心。
          "@ | Set-Content release-notes.md -Encoding UTF8
          ./scripts/package-update.ps1 `
            -Version $version `
            -Installer "publish/$installerName" `
            -DownloadUrl "https://github.com/$env:RELEASE_REPOSITORY/releases/download/$env:RELEASE_TAG/$installerName" `
            -Notes release-notes.md `
            -OutputDirectory publish

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $installer = "publish/SSH-Router_${version}_x64-setup.exe"
          gh release create $env:RELEASE_TAG `
            $installer `
            "$installer.sig" `
            "publish/latest.json" `
            --title "SSH Router $env:RELEASE_TAG" `
            --notes-file release-notes.md `
            --verify-tag

      - name: Verify published updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $installerName = "SSH-Router_${version}_x64-setup.exe"
          New-Item -ItemType Directory -Force verify | Out-Null
          gh release download $env:RELEASE_TAG --dir verify
          $localHash = (Get-FileHash "publish/$installerName" -Algorithm SHA256).Hash
          $remoteHash = (Get-FileHash "verify/$installerName" -Algorithm SHA256).Hash
          if ($localHash -ne $remoteHash) { throw "Published installer hash mismatch" }
          $manifest = Get-Content "verify/latest.json" -Raw | ConvertFrom-Json
          $platform = $manifest.platforms.'windows-x86_64'
          if ($manifest.version -ne $version) { throw "latest.json version mismatch" }
          if (-not $platform.url.EndsWith($installerName)) { throw "latest.json URL mismatch" }
          if ($platform.signature -ne (Get-Content "verify/$installerName.sig" -Raw)) {
            throw "latest.json signature mismatch"
          }
          target/release/ssh-router-update-packager.exe verify `
            --installer "verify/$installerName" `
            --signature "verify/$installerName.sig"
          if ($LASTEXITCODE -ne 0) { throw "Published signature verification failed" }
