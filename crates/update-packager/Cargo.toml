[package]
name = "ssh-router-update-packager"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "ssh-router-update-packager"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
minisign = "0.9.1"
minisign-verify = "0.2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ssh-router-app-core = { package = "ssh-router-app-core", path = "../app-core" }
tempfile = "3"
