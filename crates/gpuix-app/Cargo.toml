[package]
name = "ssh-router-gpuix"
version = "0.0.8"
edition = "2021"

[lib]
name = "ssh_router_desktop"
crate-type = ["cdylib"]

[[bin]]
name = "ssh-router-backend"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-router-app-core = { path = "../app-core" }
ssh-router-config = { path = "../config" }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"
