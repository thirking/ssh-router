[package]
name = "ssh-router-gpui"
version = "0.0.8"
edition = "2021"

[[bin]]
name = "ssh-router"
path = "src/main.rs"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui-component = { version = "=0.5.1", default-features = false }
ssh-router-config = { path = "../config" }
ssh-router-app-core = { package = "ssh-router-app-core", path = "../app-core" }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
