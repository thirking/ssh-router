[package]
name = "ssh-router-app-core"
version = "0.0.8"
edition = "2021"

[lib]
path = "src/app_core.rs"

[dependencies]
serde_json = "1"
ssh-router-config = { path = "../config" }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
